<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Change password · Staff Portal</title>
  <link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#2563eb">
  <link rel="icon" href="/icons/icon-192.png"><link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/css/style.css?v=20261024">
  <script src="/js/config.js"></script>
</head>
<body>
<header id="topbar"></header>
<div id="loading" class="spinner-page">Loading…</div>
<main class="wrap" id="main" hidden>
  <div class="page-head"><div><h1>Change password</h1><p class="sub">For your security, enter your current password first.</p></div></div>
  <div class="banner warn" id="firstBanner" hidden style="max-width:520px">Welcome! Your admin created your account with a temporary password. Please choose your own password to continue.</div>
  <div class="card" style="max-width:520px">
    <form id="pwForm">
      <div class="field"><label for="cur" id="curLbl">Current password</label><input id="cur" type="password" required autocomplete="current-password"></div>
      <div class="field"><label for="pw">New password</label><input id="pw" type="password" minlength="8" required autocomplete="new-password"><div class="hint">At least 8 characters.</div></div>
      <div class="field"><label for="pw2">Confirm new password</label><input id="pw2" type="password" minlength="8" required autocomplete="new-password"></div>
      <button class="btn" id="pwBtn">Update password</button>
    </form>
  </div>
</main>
<script type="module">
  import { requireUser, auth, $, toast, busy, api, invalidate, APP_NAME } from '/js/app.js';
  import { EmailAuthProvider, reauthenticateWithCredential, updatePassword } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
  document.title = `Change password · ${APP_NAME}`;
  const { user, profile } = await requireUser();
  const first = !!profile.mustChangePassword;
  if (first) { $('#firstBanner').hidden = false; $('#curLbl').textContent = 'Temporary password (from your admin / email)'; $('h1').textContent = 'Choose your password'; }

  $('#pwForm').onsubmit = async e => {
    e.preventDefault();
    if ($('#pw').value !== $('#pw2').value) return toast('New passwords do not match.', 'bad');
    if ($('#pw').value === $('#cur').value) return toast('New password must be different.', 'bad');
    const b = $('#pwBtn'); busy(b, true, 'Updating…');
    try {
      await reauthenticateWithCredential(user, EmailAuthProvider.credential(user.email, $('#cur').value));
      await updatePassword(user, $('#pw').value);
      e.target.reset(); toast('Password updated.', 'ok');
      if (first) {
        await api('/api/notify', { event: 'password_changed' }).catch(() => {});
        await invalidate('users/');
        setTimeout(() => location.href = ['admin', 'deptadmin', 'super'].includes(profile.role) ? '/admin.html' : '/dashboard.html', 900);
      }
    } catch (err) {
      toast(err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password' ? 'Current password is wrong.' : err.message, 'bad');
    }
    busy(b, false);
  };
</script>
</body>
</html>
